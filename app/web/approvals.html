<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小夕 · 审批工作台</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#19312e;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}header{padding:24px 6vw;border-bottom:1px solid #dce4de;background:white;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header span{font-size:13px;color:#65766d}main{max-width:1060px;margin:36px auto;padding:0 24px}.intro{display:flex;justify-content:space-between;align-items:center}.intro h2{font-size:32px;margin:0 0 10px}p{color:#687a70;line-height:1.6}.connection{background:#fff;padding:24px;border:1px solid #dce4de;border-radius:14px;display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;margin:28px 0}label{font-size:13px;display:block;color:#466155}input,textarea,select{font:inherit;width:100%;border:1px solid #cbd8cf;border-radius:7px;padding:11px;background:white;margin-top:8px}textarea{resize:vertical;min-height:82px}button{cursor:pointer;border:0;border-radius:7px;padding:12px 20px;background:#175b46;color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:default}button.secondary{background:#eaf0eb;color:#24583e}.card{background:white;border:1px solid #dce4de;border-radius:14px;padding:24px;margin:18px 0}.top{display:flex;justify-content:space-between;gap:20px}.amount{font-size:27px;font-weight:650}.badge{font-size:12px;background:#fff2d7;padding:5px 10px;border-radius:18px;display:inline-block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.actions{display:flex;gap:10px;margin-top:18px;align-items:center}.muted{font-size:12px;color:#748378;overflow-wrap:anywhere}.empty{text-align:center;padding:65px 20px;border:1px dashed #b9ccc0;border-radius:14px}#notice{white-space:pre-wrap;color:#8b481b;min-height:24px}footer{font-size:12px;color:#77867e;padding:25px 0}#notifications{padding:0;list-style:none;font-size:13px}#notifications li{padding:12px 0;border-bottom:1px solid #dce4de}@media(max-width:720px){.connection,.grid{grid-template-columns:1fr}.intro{display:block}header span{display:none}}
</style>
<header><h1>小夕 <span style="color:#175b46">/</span> 审批工作台</h1><span>人工审核 · 操作可追溯</span></header>
<main><div class="intro"><div><h2>待审核操作</h2><p>核对业务信息，逐项批准、修改或拒绝。</p></div><span class="badge" id="count">尚未连接</span></div>
<form class="connection" id="connect"><label>会话 ID<input id="session" required autocomplete="off" placeholder="输入 session_id"></label><label>审批登录凭证<input id="token" type="password" required autocomplete="off" placeholder="Bearer token"></label><button>查看待办</button></form>
<div id="notice" role="status" aria-live="polite"></div><section id="cards"><div class="empty">连接会话后，这里会显示需要审核的操作。</div></section>
<h3>通知</h3><ul id="notifications"></ul><footer>同一批次的全部决定收齐后才执行。凭证仅保留在当前页面内存中；服务端仍会核验身份、权限和有效期。</footer></main>
<script>
let session='',token='',cursor=0,poll=null,busy=false,version=0,drafts=new Map();
const $=id=>document.getElementById(id);const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(!r.ok){let e=await r.json();throw Error(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail))}return r.json()}
function notify(message){$('notice').textContent=message}
async function refresh(){if(!session||busy)return;try{let data=await api('/sessions/'+encodeURIComponent(session)+'/approvals');render(data.actions)}catch(e){notify(e.message)}}
function render(actions){$('cards').replaceChildren();$('count').textContent=actions.length+' 项待审核';if(!actions.length){$('cards').append(text('div','当前没有待审批操作。','empty'));return}for(const a of actions){const card=text('article','','card'),top=text('div','','top');top.append(text('strong',a.order_id||a.name),text('span',a.amount==null?'金额待核验':'¥ '+Number(a.amount).toFixed(2),'amount'));card.append(top,text('p','原申请原因：'+(a.reason||'—')),text('p','有效期至 '+new Date(a.expires_at*1000).toLocaleString(),'muted'),text('p','操作编号：'+a.call_id,'muted'));const draft=drafts.get(a.call_id)||{};const grid=text('div','','grid');const order=text('label','订单号'),oi=document.createElement('input');oi.value=a.order_id||'';oi.readOnly=true;order.append(oi);const reason=text('label','退款原因'),ri=document.createElement('input');ri.value=draft.reason??a.reason??'';reason.append(ri);grid.append(order,reason);card.append(grid);const note=text('label','审核说明 / 拒绝原因'),ni=document.createElement('textarea');ni.placeholder='拒绝时请说明原因';ni.value=draft.note||'';const saveDraft=()=>drafts.set(a.call_id,{reason:ri.value,note:ni.value});ri.oninput=saveDraft;ni.oninput=saveDraft;note.append(ni);card.append(note);const buttons=text('div','','actions');for(const [type,label] of [['approve','批准'],['edit','修改后批准'],['reject','拒绝']]){const b=text('button',label,type==='reject'?'secondary':'');b.disabled=a.expires_at*1000<=Date.now();b.onclick=async()=>{if(type==='reject'&&!ni.value.trim()){notify('请填写拒绝原因');return}const d={call_id:a.call_id,type,message:ni.value.trim()};if(type==='edit')d.arguments={order_id:oi.value.trim(),reason:ri.value.trim()};busy=true;card.querySelectorAll('button').forEach(x=>x.disabled=true);try{await api('/sessions/'+encodeURIComponent(session)+'/approval',{method:'POST',body:JSON.stringify({decisions:[d]})});notify('审核决定已提交。')}catch(e){notify(e.message)}finally{busy=false;await refresh()}};buttons.append(b)}card.append(buttons);$('cards').append(card)}}
async function events(generation){while(generation===version){try{const response=await fetch('/sessions/'+encodeURIComponent(session)+'/events?timeout_seconds=15',{headers:{Authorization:'Bearer '+token,'Last-Event-ID':String(cursor)}});if(response.status===410){notify('通知游标已过期，已重新同步待办');cursor=0;await refresh();continue}if(!response.ok)throw Error('通知连接失败，请检查凭证');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(generation===version){const{done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){const frame=buffer.slice(0,end);buffer=buffer.slice(end+2);const line=frame.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const event=JSON.parse(line.slice(6));if(event.sequence<=cursor)continue;cursor=event.sequence;if(['approval_required','approval_expired','run_completed','run_failed','run_cancelled','handoff_required'].includes(event.type)){$('notifications').prepend(text('li',new Date(event.timestamp).toLocaleTimeString()+' · '+({'approval_required':'有新的待审核操作','approval_expired':'审批已超时，未执行退款','run_completed':'本次运行已完成','run_failed':'运行失败，请核对结果','run_cancelled':'用户已取消','handoff_required':'已转人工'}[event.type])));await refresh()}}}reader.cancel()}catch(e){if(generation===version)notify(e.message)}await new Promise(r=>setTimeout(r,1000))}}
$('connect').onsubmit=async e=>{e.preventDefault();drafts.clear();session=$('session').value.trim();token=$('token').value;cursor=0;version++;clearInterval(poll);notify('');await refresh();events(version);poll=setInterval(()=>{if(!document.querySelector('textarea:focus,input:focus'))refresh()},15000)};
</script></html>
