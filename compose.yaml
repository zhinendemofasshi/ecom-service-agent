services:
  api:
    image: ${ECOM_IMAGE:-ecom-service-agent:local}
    build: .
    env_file: ${ECOM_RUNTIME_ENV:-./deploy/runtime.env}
    environment:
      ECOM_ENV_FILE: ""
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - state:/srv/ecom/app/sessions
    expose: ["8000"]
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped
volumes:
  state:
