worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    # No request/body/header access logs. Keep high-level errors only.
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;
    limit_req_status 429;
    server {
        listen 8080;
        client_max_body_size 64k;
        location / {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
            # No identity can be asserted by incoming legacy headers.
            proxy_set_header X-Tenant-ID "";
            proxy_set_header X-User-ID "";
            proxy_set_header X-Actor-ID "";
            proxy_set_header X-Approval-Key "";
            proxy_set_header X-Admin-Key "";
        }
    }
}
